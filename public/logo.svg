<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d76e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3" />
  <!-- Inner background -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)" />
  <!-- Decorative inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5" />
  <!-- HR monogram -->
  <text x="100" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">HR</text>
  <!-- Divider line -->
  <line x1="60" y1="110" x2="140" y2="110" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5" />
  <!-- SINCE 1950 -->
  <text x="100" y="132" font-family="sans-serif" font-size="11" font-weight="600" fill="#d4af37" text-anchor="middle" letter-spacing="3">SINCE 1950</text>
  <!-- Decorative stars -->
  <circle cx="55" cy="100" r="2" fill="#d4af37" opacity="0.6" />
  <circle cx="145" cy="100" r="2" fill="#d4af37" opacity="0.6" />
</svg>
